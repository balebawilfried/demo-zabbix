
services:

  mysql-server:
    image: mysql:8.0
    container_name: zabbix-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_bin
      - --log-bin-trust-function-creators=1
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - zabbix-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  zabbix-server:
    image: zabbix/zabbix-server-mysql:alpine-7.0-latest
    container_name: zabbix-server
    restart: unless-stopped
    environment:
      DB_SERVER_HOST: mysql-server
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "10051:10051"
    #expose:
      #- 10051
    depends_on:
      mysql-server:
        condition: service_healthy
    volumes:
      - zabbix_server_data:/var/lib/zabbix
    networks:
      - zabbix-network
    

  zabbix-web:
    image: zabbix/zabbix-web-nginx-mysql:alpine-7.0-latest
    container_name: zabbix-web
    restart: unless-stopped
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: mysql-server
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      PHP_TZ: ${PHP_TZ}
    ports:
      - "${ZABBIX_WEB_PORT}:8080"
    #expose:
      #- 8080
    depends_on:
      - zabbix-server
      - mysql-server
    networks:
      - zabbix-network
    

  zabbix-agent:
    image: zabbix/zabbix-agent:alpine-7.0-latest
    container_name: zabbix-agent-server
    hostname: agent-zabbix-server
    restart: unless-stopped
    init: true

    environment:
      # Nom de l'hôte déclaré dans Zabbix
      ZBX_HOSTNAME: "agent-zabbix-server"

      # Serveur Zabbix
      ZBX_SERVER_HOST: "192.168.152.130"

      # Autoriser les connexions passives
      ZBX_PASSIVE_ALLOW: "true"
      ZBX_PASSIVESERVERS: "192.168.152.130"

      # Ecoute
      ZBX_LISTENIP: "0.0.0.0"
      ZBX_LISTENPORT: "10050"

      ZBX_TIMEOUT: "10"
      ZBX_DEBUGLEVEL: "3"

    ports:
      - 10050:10050

    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /dev:/host/dev:ro

    depends_on:
      - zabbix-server

    networks:
      - zabbix-network

volumes:
  mysql_data:
  zabbix_server_data:

networks:
  zabbix-network:
    driver: bridge
