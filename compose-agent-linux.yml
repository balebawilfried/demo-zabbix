
services:

  zabbix-agent:
    image: zabbix/zabbix-agent:alpine-7.0-latest
    container_name: zabbix-agent
    restart: unless-stopped

    environment:
      ZBX_SERVER_HOST: "IP_OU_DNS_DU_SERVEUR_ZABBIX"
      ZBX_HOSTNAME: "linux-server-01"
      ZBX_SERVER_PORT: 10051

    ports:
      - 10050:10050
    #expose:
      #- 10050:10050

    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /dev:/host/dev:ro
      - /etc/localtime:/etc/localtime:ro

    networks:
      - zabbix-agent-network

networks:
  zabbix-agent-network:
    driver: bridge
